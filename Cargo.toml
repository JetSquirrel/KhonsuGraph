[workspace]
resolver = "2"
members = [
    "crates/khonsu-core",
    "crates/khonsu-cli",
    "crates/khonsu-plugin-protocol",
    "crates/khonsu-dash",
    "plugins/csv",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JetSquirrel/KhonsuGraph"
rust-version = "1.97.1"

[workspace.dependencies]
# Engine access is pinned to one version and wrapped in khonsu-core::engine.
hawdb = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
tempfile = "3"
khonsu-core = { path = "crates/khonsu-core" }
khonsu-plugin-protocol = { path = "crates/khonsu-plugin-protocol" }
khonsu-dash = { path = "crates/khonsu-dash" }

[profile.dev.package."*"]
opt-level = 1
