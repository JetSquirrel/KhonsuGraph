[package]
name = "khonsugraph"
description = "KhonsuGraph desktop app: a local-first workbench for HawDB graphs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# gpui-kit and gpui-graph must share GPUI and gpui-base theme types.
gpui-kit = { version = "0.8.0", features = ["tree-sitter-sql"] }
gpui-graph = "=0.1.2"
khonsu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
smol = "2"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
khonsu-dash.workspace = true
# The dashboard source editor speaks LSP types, as in DuckLocal.
lsp-types = "0.97"
# Map tiles, opt-in like DuckLocal's base map.
ureq = { version = "3", default-features = false, features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
gpui-kit = { version = "0.8.0", features = ["test-support"] }
