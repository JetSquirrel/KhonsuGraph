[package]
name = "khonsugraph"
description = "KhonsuGraph desktop app: a local-first workbench for HawDB graphs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Same pinned revision as DuckLocal: one copy of the toolkit, one look.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }
khonsu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
smol = "2"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["test-support"] }
