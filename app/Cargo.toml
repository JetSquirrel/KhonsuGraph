[package]
name = "khonsugraph"
description = "KhonsuGraph desktop app: a local-first workbench for HawDB graphs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned to the release gpui-graph builds against: both must share one GPUI.
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-sql"] }
gpui-graph = { path = "../../gpui-graph/crates/gpui-graph" }
khonsu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
smol = "2"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
