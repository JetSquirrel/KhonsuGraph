name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check out gpui-graph
        run: git clone --depth 1 https://github.com/JetSquirrel/gpui-graph ../gpui-graph

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build release binaries
        run: cargo build --release --locked --target aarch64-apple-darwin -p khonsugraph -p khonsu-cli -p khonsu-plugin-csv -p khonsu-plugin-aws

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          # A throwaway keychain, so no distribution key outlives the run.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/"//g')
          rm -f "$CERTIFICATE_PATH"

          echo "NOTARY_KEY=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dmgbuild
        run: pipx install dmgbuild

      - name: Package, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          scripts/package-macos.sh target/aarch64-apple-darwin/release khonsugraph-macos-arm64.dmg "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: khonsugraph-macos-arm64.dmg
          path: khonsugraph-macos-arm64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out gpui-graph
        shell: bash
        run: git clone --depth 1 https://github.com/JetSquirrel/gpui-graph ../gpui-graph

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release binaries
        run: cargo build --release --locked -p khonsugraph -p khonsu-cli -p khonsu-plugin-csv -p khonsu-plugin-aws

      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1 target/release khonsugraph-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: khonsugraph-windows-x86_64.zip
          path: khonsugraph-windows-x86_64.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: KhonsuGraph ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/khonsugraph-macos-arm64.dmg
            artifacts/**/khonsugraph-windows-x86_64.zip
