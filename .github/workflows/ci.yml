name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS is where the app ships; Windows catches path mistakes (drive
    # letters, `\`) and HawDB's Windows quirks.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The investigation and template gates run the AWS plugin, which lives
      # in the marketplace with its saved responses (app/tests/aws_plugin).
      - uses: actions/checkout@v4
        with:
          repository: JetSquirrel/khonsugraph-marketplace
          path: khonsugraph-marketplace

      - name: Point the tests at the marketplace
        shell: bash
        run: echo "KHONSU_MARKETPLACE=$GITHUB_WORKSPACE/khonsugraph-marketplace" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure Windows CI debug information
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_PROFILE_DEV_DEBUG=0" >> $env:GITHUB_ENV
          "CARGO_PROFILE_TEST_DEBUG=0" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Both platforms: each compiles code the other does not.
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace
